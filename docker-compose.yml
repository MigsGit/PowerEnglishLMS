version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: PowerEnglishLMS
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql_db
    ports:
      - 8080:8080

  mysql_db:
    image: mysql:latest
    container_name: PowerEnglishLMS-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: PowerEnglishLMS-phpmyadmin
    restart: unless-stopped
    ports:
      - "9001:80"
    environment:
      PMA_HOST: mysql_db
      PMA_PORT: 3306
    depends_on:
      - mysql_db

volumes:
  mysql_data:
