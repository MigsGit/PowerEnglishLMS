services:
    pixelx:
        container_name: we-pixelx
        build:
            context: .
            target: php
            args:
                - APP_ENV=${APP_ENV}
        environment:
            - APP_ENV=${APP_ENV}
        working_dir: /app
        volumes:
            - ./:/app
        ports:
            - 8302:8302
    mysql_db:
        image: mysql:latest
        container_name: wiseeducation-mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: root
        ports:
            - "3307:3306"
        volumes:
            - mysql_data:/var/lib/mysql

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: wiseeducation-phpmyadmin
        restart: unless-stopped
        ports:
            - "9001:80"
        environment:
            PMA_HOST: mysql_db
            PMA_PORT: 3306
        depends_on:
            - mysql_db
networks:
  laravel-network:
    driver: bridge

volumes:
  mysql_data:
